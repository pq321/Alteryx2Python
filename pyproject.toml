[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alteryx-migration-python"
version = "0.1.0"
description = "Foundational Alteryx-to-Python migration framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<2.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
]

[project.scripts]
alteryx2python = "alteryx2python.cli:main"

[project.optional-dependencies]
parity = ["yxdb==1.1.1"]
local = [
    "scipy>=1.13", "scikit-learn>=1.5", "statsmodels>=0.14", "Pillow>=10",
    "pypdf>=5", "jsonschema>=4", "matplotlib>=3.9", "wordcloud>=1.9", "shapely>=2", "duckdb>=1.1",
]
nlp = ["vaderSentiment>=3.3.2", "spacy>=3.8"]
notebooks = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6.29"]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=alteryx2python --cov-report=term-missing"

[tool.coverage.run]
branch = false
source = [
    "alteryx2python",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
include = ["alteryx2python*", "alteryx_runtime*"]

[tool.setuptools.package-data]
alteryx2python = ["parser/*.json"]
