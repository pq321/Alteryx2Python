[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alteryx-migration-python"
version = "0.1.0"
description = "Foundational Alteryx-to-Python migration framework"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0,<2.3.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
]

[project.scripts]
alteryx2python = "alteryx2python.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=alteryx2python --cov-report=term-missing"

[tool.coverage.run]
branch = false
source = [
    "alteryx2python",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
include = ["alteryx2python*", "alteryx_runtime*"]
